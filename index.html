<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dante FlashBot Clone</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1014;
      color: #00ffcc;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 1rem;
      background: #1a1d24;
      font-size: 1.5rem;
    }
    .container {
      padding: 2rem;
    }
    input, button {
      padding: 0.6rem;
      font-size: 1rem;
      margin: 1rem;
      border-radius: 5px;
      border: none;
    }
    .signal-box {
      font-size: 2rem;
      margin-top: 2rem;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header>Dante FlashBot Clone</header>
  <div class="container">
    <label for="stake">Enter Stake:</label>
    <input type="number" id="stake" placeholder="$3" />
    <br />
    <button onclick="generateSignal()">Get Signal</button>
    <div class="signal-box" id="signalBox">Waiting for signal...</div>
  </div>

  <script>
    function generateSignal() {
      const signals = [
        "Trade DIGITOVER 5",
        "Trade DIGITUNDER 6",
        "Trade DIGITOVER 2",
        "Trade DIGITUNDER 7",
        "Trade DIGITOVER 3",
      ];
      const pick = signals[Math.floor(Math.random() * signals.length)];
      document.getElementById("signalBox").innerText = pick +
        " with stake $" + document.getElementById("stake").value;
    }
  </script>
</body>
</html>
